name: Renderizar vídeos

# Cada vídeo es un trabajo aparte (en paralelo); cada push con escenas nuevas lanza su propia tanda.
# Si un vídeo sale mal, se vuelve a poner en «escena» y se hace push.
# Renderiza los vídeos en estado «escena» (escena 3D escrita por Claude) y los deja «en revisión» en el panel.
on:
  push:
    branches: [main]
    paths: ["produccion/escenas/*_scene.py", "produccion/escenas/*_ov.py", "produccion/producir.sh", "produccion/motor/**", ".github/workflows/render.yml"]
  workflow_dispatch:
    inputs:
      nombres:
        description: "Nombres a renderizar separados por espacios (vacío = todos los que estén en estado «escena»)"
        required: false

concurrency:
  group: render-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  lista:
    runs-on: ubuntu-latest
    outputs:
      nombres: ${{ steps.l.outputs.nombres }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: produccion
      - id: l
        env:
          FORZAR: ${{ inputs.nombres }}
        run: |
          git config user.name "programador-explicadoen60s"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 - <<'PY' > /tmp/out.txt
          import json, os
          f = os.environ.get("FORZAR", "").split()
          est = json.load(open("produccion/estado.json"))
          # solo los que ya tienen su escena subida en este commit (si no, el render falla y se queda atascado con error)
          listo = lambda i: all(os.path.exists(f"produccion/escenas/{i}{s}") for s in ("_scene.py", "_ov.py", ".mp3"))
          n = [i for i in f if listo(i)] if f else [v["id"] for v in est["videos"] if v.get("estado") == "escena" and listo(v["id"])]
          for v in est["videos"]:
              if v["id"] in n and v.get("estado") == "escena": v["estado"] = "renderizando"   # que otra ejecución no los repita (los ya aprobados no cambian)
          json.dump(est, open("produccion/estado.json", "w"), ensure_ascii=False, indent=1)
          print("nombres=" + json.dumps(n))
          PY
            git add produccion/estado.json
            git diff --cached --quiet && break
            git commit -qm "Producción: renderizando [skip ci]" && git push -q && break
            sleep 5
          done
          cat /tmp/out.txt >> $GITHUB_OUTPUT

  render:
    needs: lista
    if: needs.lista.outputs.nombres != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        nombre: ${{ fromJSON(needs.lista.outputs.nombres) }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: produccion
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar Blender y herramientas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libcairo2-dev pkg-config libxrender1 libxi6 libxkbcommon0 libsm6 libxxf86vm1 libxfixes3 libegl1 libgl1 libgl1-mesa-dri libglx-mesa0 > /dev/null
          pip install -q bpy==5.2.3 numpy pycairo
          mkdir -p ~/.fonts && cp produccion/fuentes/*.ttf ~/.fonts/ && fc-cache -f > /dev/null
      - name: Renderizar ${{ matrix.nombre }}
        run: |
          set -o pipefail
          produccion/producir.sh "${{ matrix.nombre }}" 2>&1 | grep -v "render           | Saved" | tee /tmp/log_${{ matrix.nombre }}.txt
      - name: Guardar el vídeo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n="${{ matrix.nombre }}"; W=produccion/trabajo/$n
          cp $W/${n}_final_c.mp4 /tmp/$n.mp4; cp $W/${n}_tiktok_final_c.mp4 /tmp/${n}_tiktok.mp4; cp $W/${n}_hoja.png /tmp/${n}_hoja.png
          gh release view videos >/dev/null 2>&1 || gh release create videos --title "Vídeos para publicar" --notes "Almacén de vídeos del programador. No borrar." --latest=false
          gh release upload videos /tmp/$n.mp4 /tmp/${n}_tiktok.mp4 /tmp/${n}_hoja.png --clobber
          ffprobe -v error -show_entries format=duration -of csv=p=0 /tmp/$n.mp4 > /tmp/dur.txt
      - name: Guardar el registro si falla
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view videos >/dev/null 2>&1 || gh release create videos --title "Vídeos para publicar" --notes "Almacén de vídeos del programador. No borrar." --latest=false
          touch /tmp/log_${{ matrix.nombre }}.txt; tail -200 /tmp/log_${{ matrix.nombre }}.txt > /tmp/error_${{ matrix.nombre }}.txt
          gh release upload videos /tmp/error_${{ matrix.nombre }}.txt --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: dur-${{ matrix.nombre }}
          path: /tmp/dur.txt

  cerrar:
    needs: [lista, render]
    if: always() && needs.lista.outputs.nombres != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: produccion
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/durs
      - name: Marcar para revisión
        env:
          NOMBRES: ${{ needs.lista.outputs.nombres }}
        run: |
          git config user.name "programador-explicadoen60s"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 - <<'PY'
          import json, os, pathlib
          est = json.load(open("produccion/estado.json"))
          for n in json.loads(os.environ["NOMBRES"]):
              d = pathlib.Path(f"/tmp/durs/dur-{n}/dur.txt")
              for v in est["videos"]:
                  if v["id"] == n and v.get("estado") in ("renderizando", "escena", "revision"):
                      if d.exists():
                          v["estado"] = "revision"; v["duracion"] = round(float(d.read_text()), 1); v.pop("error", None)
                      else:
                          v["estado"] = "escena"; v["error"] = "Falló el renderizado (ver Actions → Renderizar vídeos)"
          json.dump(est, open("produccion/estado.json", "w"), ensure_ascii=False, indent=1)
          PY
            git add produccion/estado.json
            git diff --cached --quiet && exit 0
            git commit -qm "Producción: vídeos listos para revisar [skip ci]"
            git push -q && exit 0; sleep 6
          done
          exit 1
