name: Publicar vídeos programados

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      probar:
        description: "Solo comprobar las conexiones (no publica nada)"
        type: boolean
        default: false

concurrency:
  group: programador
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: programador
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests cryptography playwright
      - name: Publicar lo que toca
        working-directory: programador
        env:
          CLAVE_TOKENS: ${{ secrets.CLAVE_TOKENS }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          IG_APP_ID: ${{ secrets.IG_APP_ID }}
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
          TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
          TT_SESSIONID: ${{ secrets.TT_SESSIONID }}
          TT_COOKIES: ${{ secrets.TT_COOKIES }}
          GITHUB_TOKEN: ${{ github.token }}
          PROBAR: ${{ inputs.probar && '--probar' || '' }}
        run: python publicar.py $PROBAR
      - name: Captura si TikTok falló
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-captura
          path: /tmp/tiktok_fallo.png
          if-no-files-found: ignore
      - name: Guardar estado
        if: always()
        run: |
          git config user.name "programador-explicadoen60s"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in programador/calendario.json programador/tokens.enc CALENDARIO.md CONEXIONES.md; do [ -e "$f" ] && git add "$f"; done
          git diff --cached --quiet && exit 0
          git commit -qm "Programador: estado actualizado [skip ci]"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
