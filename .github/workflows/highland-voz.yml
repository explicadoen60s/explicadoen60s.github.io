name: Voz Highland (temporal)
on:
  push:
    branches: [highland-voz]
permissions:
  contents: write
  actions: read
jobs:
  guardar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: highland-voz
          sparse-checkout: highland
      - uses: actions/download-artifact@v4
        with:
          run-id: 44434980428
          github-token: ${{ github.token }}
          path: highland/wavs
          merge-multiple: true
      - run: |
          ls highland/wavs | wc -l
          git config user.name explicadoen60s; git config user.email explicadoen60s.cxn@gmail.com
          git add --sparse highland/wavs && git commit -q -m "Voz Highland: wavs" && git push -q
